services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - ${API_PORT}:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile

    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started

    env_file:
      - .env

  db:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} && psql -U ${DB_USER} -d ${DB_NAME} -c '\\dt'"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    volumes:
      - ./internal/infrastructure/db/migrations:/app/internal/infrastructure/db/migrations:r
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: redis
    ports:
      - ${REDIS_PORT}:6379

volumes:
  pgdata: